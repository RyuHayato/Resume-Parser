<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Resume Parser</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800">
  <div class="max-w-3xl mx-auto py-12 px-4">
    <h1 class="text-4xl font-bold text-slate-900 text-center">Resume Parser</h1>
    <p class="text-center text-slate-500 mt-2">Upload a PDF resume to extract structured information.</p>

    <div class="bg-white rounded-2xl shadow p-8 mt-8">
      <div id="dropZone" class="border-2 border-dashed border-slate-300 rounded-xl p-10 text-center transition hover:border-sky-400 cursor-pointer">
        <p class="text-slate-600">Drag &amp; drop your PDF here, or</p>
        <label class="inline-block mt-3 bg-sky-600 hover:bg-sky-700 text-white font-semibold px-5 py-2 rounded-lg cursor-pointer">
          Browse Files
          <input id="fileInput" type="file" accept="application/pdf,.pdf" class="hidden" />
        </label>
        <p id="fileName" class="text-sm text-slate-400 mt-3"></p>
      </div>

      <div id="spinner" class="hidden flex-col items-center justify-center mt-6">
        <div class="w-10 h-10 border-4 border-sky-200 border-t-sky-600 rounded-full animate-spin"></div>
        <p class="text-slate-500 mt-3">Parsing your resume...</p>
      </div>

      <p id="errorMsg" class="hidden mt-4 text-red-600 bg-red-50 border border-red-200 rounded-lg p-3"></p>

      <div id="results" class="hidden mt-8 space-y-6">
        <div class="border border-slate-200 rounded-xl p-5">
          <h2 class="text-lg font-semibold text-slate-900">Contact Info</h2>
          <p class="mt-2"><span class="font-medium">Name:</span> <span id="rName"></span></p>
          <p><span class="font-medium">Email:</span> <span id="rEmail"></span></p>
          <p><span class="font-medium">Phone:</span> <span id="rPhone"></span></p>
        </div>

        <div class="border border-slate-200 rounded-xl p-5">
          <h2 class="text-lg font-semibold text-slate-900">Skills</h2>
          <div id="rSkills" class="flex flex-wrap gap-2 mt-3"></div>
        </div>

        <div class="border border-slate-200 rounded-xl p-5">
          <h2 class="text-lg font-semibold text-slate-900">Education</h2>
          <p id="rEducation" class="mt-2 whitespace-pre-line"></p>
        </div>

        <div class="border border-slate-200 rounded-xl p-5">
          <h2 class="text-lg font-semibold text-slate-900">Work History</h2>
          <div id="rWork" class="mt-2 space-y-4"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
